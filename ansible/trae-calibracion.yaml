---
# El sinte es la fuente única de la config de las robotas: calibrar y guardar
# (pad GUARDAR) escribe en ~/lgptclient/bin/cliente.*.json DEL SINTE. Este
# playbook trae esos ficheros al repo de control para revisarlos y comitear.
# (Ya no se traen de las robotas: ellas reciben su config del sinte al
# conectar, por RCONFIG.)
- name: Traer la config calibrada desde el sinte
  hosts: sinte
  gather_facts: no
  tasks:
    - name: Traer bin/cliente.*.json del sinte al repo de control
      ansible.builtin.fetch:
        src: "/home/angel/lgptclient/bin/{{ item }}"
        dest: "{{ playbook_dir }}/../bin/{{ item }}"
        flat: true
      loop:
        - cliente.maleta.json
        - cliente.sombrilla.json
