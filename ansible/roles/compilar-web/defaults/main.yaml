---
# Raíz del repo en este PC (la máquina de control), donde vive la toolchain de
# Babel (node_modules/, gitignoreada) y los build.sh de cada app.
repo_root: /home/angel/lgptclient

# Apps cuyo build.sh hay que ejecutar (rutas relativas a repo_root). Cada una
# compila su src/robot.jsx -> static/robot.js.
web_build_apps: []

# Si es true, tras compilar se commitea y pushea el robot.js que haya cambiado
# (necesario para los despliegues por 'git pull' en el device, p. ej. el sinte).
# Para despliegues por rsync (vocoder) déjalo en false.
web_commit_push: false
