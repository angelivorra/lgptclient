---
# Directorio del checkout desde el que corren los servicios EN EL DEVICE.
repo_dir: /home/angel/lgptclient

# Directorio del repo EN ESTE PC (control), origen del rsync.
control_repo_dir: /home/angel/git/lgptclient

# Fichero temporal (en el control) con la lista de archivos versionados a enviar.
rsync_filelist: /tmp/sinte-rsync-filelist.txt

# Directorio del player (lttileplayer) dentro del repo, y su venv (gitignoreado,
# vive solo en el device).
sinte_app_dir: "{{ repo_dir }}/sinte"
sinte_venv_dir: "{{ sinte_app_dir }}/.venv"

# venv de sinte EN ESTE PC (control): usado para generar los "textos" antes
# de desplegar (bin/genera_textos.py necesita lgpt_parser.py, ver más abajo).
sinte_control_venv_dir: "{{ control_repo_dir }}/sinte/.venv"
