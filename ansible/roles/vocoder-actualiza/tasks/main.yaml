---
# Desactivar el ahorro de energía del wifi (brcmfmac). Con power save ON la
# radio duerme en reposo y descarta el tráfico ENTRANTE no solicitado: desde
# el PC de desarrollo se pierde SSH/OSC/ping con el vocoder aunque la señal
# sea excelente (-36 dBm), mientras que la conexión SALIENTE que el propio
# vocoder abre al sinte (tcp_client) sigue viva porque mantiene la radio
# despierta. Síntoma: "solo cae el vocoder, no el sinte". El drop-in fija
# powersave=2 (disable) para toda conexión wifi y sobrevive reprovisionados.
- name: Desactivar el power save del wifi (drop-in de NetworkManager)
  become: true
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/wifi-powersave-off.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Gestionado por ansible (rol vocoder-actualiza). Ver tasks/main.yaml.
      [connection]
      wifi.powersave = 2
  register: wifi_powersave

- name: Aplicar el power save del wifi ya mismo (sin esperar a reconectar)
  become: true
  ansible.builtin.command: /sbin/iwconfig wlan0 power off
  changed_when: false

- name: Sincronizar la app flask del vocoder
  ansible.posix.synchronize:
    src: /home/angel/git/lgptclient/vocoder/flask/
    dest: "{{ vocoder_dest }}/flask/"
    delete: yes
    checksum: true
    times: false
    perms: false
    rsync_opts:
      - "--exclude=__pycache__"
      - "--chown=patch:patch"
  register: flask_sync

- name: Copiar el parche de Carla (template01.carxp)
  ansible.builtin.copy:
    src: /home/angel/git/lgptclient/vocoder/prod/template01.carxp
    dest: "{{ vocoder_dest }}/prod/template01.carxp"
    owner: patch
    group: patch
  register: carxp_copy

# Plugin LADSPA propio (gate rítmico, ver vocoder/gater/). La Pi no tiene
# internet ni la misma arquitectura que este PC (es ARM), así que se compila EN
# la Pi: el fuente C no tiene más dependencias que libc/libm y `ladspa.h`, que
# va vendorado en el propio directorio. Se instala en /usr/lib/ladspa, la ruta
# absoluta del <Binary> del carxp, que Carla carga tal cual.
- name: Sincronizar el fuente del plugin LADSPA (gater)
  ansible.posix.synchronize:
    src: /home/angel/git/lgptclient/vocoder/gater/
    dest: "{{ vocoder_dest }}/gater/"
    delete: yes
    checksum: true
    times: false
    perms: false
    rsync_opts:
      # NO llevar el .so compilado en este PC (x86): la Pi es ARM y compila el
      # suyo. Excluirlo también lo protege del --delete, así el binario que la
      # Pi construye no se borra en cada sync.
      - "--exclude=lgpt_gater.so"
      - "--chown=patch:patch"
  register: gater_sync

- name: Compilar el plugin LADSPA (make en la Pi)
  ansible.builtin.command:
    cmd: make
    chdir: "{{ vocoder_dest }}/gater"
  register: gater_build
  changed_when: "'up to date' not in gater_build.stdout"

- name: Instalar el plugin LADSPA en /usr/lib/ladspa
  become: true
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ vocoder_dest }}/gater"
  register: gater_install
  changed_when: true
  when: gater_sync.changed or gater_build.changed

# Servicio de usuario: se reinicia como el propio usuario patch (sin become),
# fijando XDG_RUNTIME_DIR para alcanzar el systemd --user. Reinicia Carla con
# el patch nuevo. Solo si algo cambió.
- name: Reiniciar la app flask del vocoder (solo si cambió)
  ansible.builtin.systemd:
    name: "{{ vocoder_service }}"
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vocoder_uid }}"
  when: flask_sync.changed or carxp_copy.changed
        or gater_build.changed or gater_install.changed
