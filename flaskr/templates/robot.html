<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{{ name }}</title>
  <!-- Roboto + Material Icons vendorizados (funciona sin internet). -->
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <meta name="mobile-web-app-capable" content="yes">
  <style>body { margin: 0; background: #0a0e1a; }</style>
</head>
<body>
  <div id="root"></div>

  <script id="flask-data" type="application/json">
  { "name": {{ name | tojson }} }
  </script>

  <script src="{{ url_for('static', filename='vendor/react.production.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/react-dom.production.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/material-ui.production.min.js') }}"></script>
  <!-- JSX precompilado desde src/robot.jsx (ver build.sh). Sin Babel en el navegador. -->
  <script src="{{ url_for('static', filename='robot.js') }}"></script>
</body>
</html>
